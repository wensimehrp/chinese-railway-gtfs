on:
  # pull_request:
  workflow_dispatch:
    inputs:
      trains:
        description: Max trains per shard (empty = all)
  # push:
  #   branches:
  #     - main

# Never let two crawls hit 12306 at the same time.
concurrency:
  group: update
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: DeterminateSystems/flakehub-cache-action@main

      - run: |
          nix develop --command \
          uv run python shard.py \
          "${{ matrix.shard }}" \
          "${{ strategy.job-total }}" \
          "${{ inputs.trains || '0' }}"

      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: export/railgo.sqlite
