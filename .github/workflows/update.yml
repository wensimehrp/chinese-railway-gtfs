on:
  # pull_request:
  workflow_dispatch:
    inputs:
      trains:
        description: Max trains per shard (empty = all)
      shards:
        description: Number of shards
        default: "8"
      parallel:
        description: Shards crawled at once
        default: "8"
      workers:
        description: Trains crawled concurrently per shard
        default: "4"
  # push:
  #   branches:
  #     - main

# Never let two crawls hit 12306 at the same time.
concurrency:
  group: update
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      shards: ${{ steps.shards.outputs.list }}
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/determinate-nix-action@v3
      # Persist /nix/store through the GitHub Actions cache so the dev shell --
      # including the locally-built MongoDB, which is in no binary cache -- is
      # restored instead of fetched/rebuilt by every job of every run. Because
      # crawl/merge `needs:` this job, the store it saves here is also reusable
      # by them within the same run.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G

      - run: nix develop --command uv run python discover.py

      - id: shards
        env:
          SHARDS: ${{ inputs.shards || '8' }}
        run: echo "list=[$(seq -s, 0 $((SHARDS - 1)))]" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: roster
          path: roster.json

  crawl:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # 12306 rate-limits by IP, and every shard runs on its own runner. Bound
      # how many runners crawl at once; the total request rate is roughly
      # `parallel x workers`.
      max-parallel: ${{ fromJSON(inputs.parallel || '8') }}
      matrix:
        shard: ${{ fromJSON(needs.discover.outputs.shards) }}
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G

      - uses: actions/download-artifact@v4
        with:
          name: roster

      - run: |
          nix develop --command \
          uv run python shard.py \
          "${{ matrix.shard }}" \
          "${{ strategy.job-total }}" \
          "${{ inputs.trains || '0' }}" \
          "${{ inputs.workers || '4' }}"

      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: export/railgo.sqlite

  merge:
    needs: crawl
    # Shards are allowed to fail (fail-fast is off), so merge whatever landed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G

      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*

      - run: |
          nix develop --command \
          uv run python merge.py \
          export/railgo.sqlite \
          '**/railgo.sqlite'

      - uses: actions/upload-artifact@v4
        with:
          name: railgo
          path: |
            export/railgo.sqlite
            data/railgo.json
