on:
  # pull_request:
  workflow_dispatch:
    inputs:
      trains:
        description: Number of trains to crawl (empty = all)
        default: "50"
  # push:
  #   branches:
  #     - main

permissions:
  id-token: write
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    env:
      TRAINS: ${{ inputs.trains }}
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: DeterminateSystems/flakehub-cache-action@main

      - run: |
          cat > crawl.sh <<'EOF'
          set -euo pipefail

          # railgo-parser's exporters need a local MongoDB.
          railgo-mongod &
          for _ in $(seq 30); do
            mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' | grep -q 1 && break
            sleep 1
          done

          if [ -n "${1:-}" ]; then
            uv run chinese-railway-gtfs crawl --seed-stations --trains "$1"
          else
            uv run chinese-railway-gtfs crawl --seed-stations
          fi
          uv run chinese-railway-gtfs postprocess
          EOF
          nix develop --command bash crawl.sh "${TRAINS}"

      - uses: actions/upload-artifact@v4
        with:
          name: data
          path: |
            export/railgo.sqlite
            data/railgo.json
